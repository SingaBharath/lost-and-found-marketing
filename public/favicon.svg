<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="navLogoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Outer Gradient Squircle Frame -->
  <rect width="36" height="36" rx="10" fill="url(#navLogoGradient)" />

  <!-- Inner Dark Core Container -->
  <rect width="32" height="32" x="2" y="2" rx="8" fill="#050508" />

  <!-- Search Magnifying Glass (Identical to Lucide Search icon in Navbar.tsx) -->
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#C084FC" stroke-width="2.5" />
  <line x1="20.2" y1="20.2" x2="25" y2="25" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" />
</svg>
