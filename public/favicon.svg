<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Rounded Square Container -->
  <rect width="100" height="100" rx="26" fill="#050508"/>
  
  <!-- Glowing Purple/Pink Gradient Border -->
  <defs>
    <linearGradient id="navbarLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <rect width="94" height="94" x="3" y="3" rx="24" fill="none" stroke="url(#navbarLogoGradient)" stroke-width="6"/>

  <!-- Search Lens Icon (Identical to Navbar Lucide Search icon) -->
  <circle cx="44" cy="44" r="20" fill="none" stroke="#A855F7" stroke-width="8" stroke-linecap="round"/>
  <line x1="59" y1="59" x2="77" y2="77" stroke="#A855F7" stroke-width="9" stroke-linecap="round"/>
</svg>
